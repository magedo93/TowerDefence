<!doctype html>
<!--
  Egyptian-theme map decorations, original vector art for Tower Defence.
  Rendered by Tools/Art/build-egypt-art.ps1 (headless Edge, 512 px per cell, downscaled to 64)
  into tile-sheet cells 130-137, in this order: date palm, young palm, papyrus, lotus pool,
  aloe, sandstone rock, fallen column, hieroglyph stone. Top-down view, flat shading,
  light from the top-left, soft shadow to the bottom-right (matches the Kenney style).
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { display: flex; width: 4096px; height: 512px; }
  svg { width: 512px; height: 512px; flex: none; display: block; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <!-- One palm frond pointing up from the crown at (256,256). -->
    <path id="frond" d="M256,256 C214,196 214,112 256,44 C298,112 298,196 256,256 Z"/>
    <path id="frondDark" d="M256,256 C214,196 214,112 256,44 L256,256 Z"/>
    <path id="frondRib" d="M256,250 L256,58" fill="none" stroke-width="6" stroke-linecap="round"/>
  </defs>
</svg>

</svg>
