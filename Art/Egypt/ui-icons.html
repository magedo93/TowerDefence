<!doctype html>
<!--
  Egyptian-theme UI icons and coins, original vector art for Tower Defence.
  Rendered by Tools/Art/build-egypt-art.ps1 (headless Edge, one 512 px slot each), in order:
    0 money.png (100x100)   - linen coin pouch tied with a gold cord, ankh seal
    1 hearth.png (100x100)  - carnelian heart amulet (ib) in a gold setting
    2 coins_0 (copper)      - coins.png cell 0: copper coin with an ankh   (32 px coin in a 64 px cell)
    3 coins_1 (gold)        - coins.png cell 1: gold coin with the Eye of Horus
    4 coins_2 (silver)      - coins.png cell 2: silver coin with a scarab
    5 coins_3 (shadow)      - coins.png cell 3: coin shadow, black at 20% (as the original)
    6 sheet cell 181        - the player's base stones at the end of the road: sandstone octagon
  Coin faces stay readable while CoinScript flips them around the y axis.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { display: flex; width: 3584px; height: 512px; }
  svg { width: 512px; height: 512px; flex: none; display: block; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute; width:0; height:0">
  <defs>
    <path id="ankh" d="M0,-46 C-20,-46 -26,-20 -8,-6 L-30,-6 L-30,6 L-6,6 L-6,46 L6,46 L6,6 L30,6 L30,-6 L8,-6 C26,-20 20,-46 0,-46 Z M0,-34 C10,-34 10,-16 0,-10 C-10,-16 -10,-34 0,-34 Z" fill-rule="evenodd"/>
    <!-- Coin: 32 px across in a 64 px cell = radius 128 in 512 units. -->
    <g id="coinRim"><circle cx="256" cy="256" r="124"/></g>
  </defs>
</svg>

  <path d="M300,160 C320,200 330,220 316,250 M310,160 C350,190 362,214 360,240" fill="none" stroke="#e8b83f" stroke-width="12" stroke-linecap="round"/>

</body>
